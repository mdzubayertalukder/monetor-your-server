apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulseops-sa
  namespace: pulseops
  labels:
    app.kubernetes.io/name: pulseops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pulseops-cluster-role
  labels:
    app.kubernetes.io/name: pulseops
rules:
  # Core Resources for telemetry & diagnostics
  - apiGroups: [""]
    resources:
      - nodes
      - namespaces
      - pods
      - pods/log
      - pods/status
      - services
      - endpoints
      - events
      - configmaps
    verbs: ["get", "list", "watch"]

  # Pod Restart Capability (DevOps pod cycle action)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]

  # Workloads & Scale Controls
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/scale
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch", "patch", "update"]

  # Metrics server integration (optional)
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pulseops-cluster-role-binding
  labels:
    app.kubernetes.io/name: pulseops
subjects:
  - kind: ServiceAccount
    name: pulseops-sa
    namespace: pulseops
roleRef:
  kind: ClusterRole
  name: pulseops-cluster-role
  apiGroup: rbac.authorization.k8s.io
