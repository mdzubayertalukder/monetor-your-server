apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulseops-monitor
  namespace: pulseops
  labels:
    app.kubernetes.io/name: pulseops
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pulseops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulseops
        app.kubernetes.io/component: monitoring
    spec:
      serviceAccountName: pulseops-sa
      containers:
        - name: pulseops
          image: pulseops-monitor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
              name: http
          envFrom:
            - configMapRef:
                name: pulseops-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8088
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8088
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: pulseops-storage
              mountPath: /app/data
      volumes:
        - name: pulseops-storage
          emptyDir: {}
