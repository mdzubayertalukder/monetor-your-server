apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulseops-ingress
  namespace: pulseops
  labels:
    app.kubernetes.io/name: pulseops
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: pulseops-service
spec:
  rules:
    - host: pulseops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulseops-service
                port:
                  number: 8088
